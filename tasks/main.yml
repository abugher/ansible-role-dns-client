---
- include_tasks:        'tasks/common/remove_packages.yml'
- shell:                test -e /lib/systemd/systemd-resolved
  failed_when:          False
  changed_when:         False
  register:             systemd_resolved_check
- include_tasks:        'tasks/common/disable_services.yml'
  when:                 0 == systemd_resolved_check.rc
- include_tasks:        'tasks/common/mask_services.yml'
  when:                 0 == systemd_resolved_check.rc
- include_tasks:        'tasks/common/stop_services.yml'
  when:                 0 == systemd_resolved_check.rc
- include_tasks:        'tasks/common/template_files.yml'
